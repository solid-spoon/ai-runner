name: build
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: build/airun
            name: linux-x64
          - os: windows-latest
            artifact: build/Release/airun.exe
            name: windows-x64
          - os: macos-13
            artifact: build/airun
            name: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: airun-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
